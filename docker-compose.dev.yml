# Desarrollo con recarga en caliente
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml --profile db up --build   # con PostgreSQL en contenedor
name: elecciones-dev

services:
  backend:
    build:
      context: ./backend/org-elecciones-ws
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - ./backend/org-elecciones-ws:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./frontend/org-elecciones-web
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/org-elecciones-web:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  postgres:
    profiles: [db]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  backend_node_modules:
  frontend_node_modules:
  pgdata_dev:
