<div id="dashboard" *ngIf="showDashboard">

  <mat-card>
    <mat-card-content>
      <!-- <form [formGroup]="myForm"> -->
      <div class="row">
        <div class="col-md">
          <div class="form-group">
            <label for="" class="fw-bold">Buscar por dignidad </label>
            <div class="form-group">
              <p-dropdown (onChange)="onChangeDignidad()" [options]="dignidades" [(ngModel)]="dignidad"
                optionValue="descripcion" placeholder="Selecciona la dignidad" [filter]="true" filterBy="descripcion"
                [style]="{'width':'100%'}" optionLabel="descripcion" [showClear]="true">
              </p-dropdown>
            </div>

          </div>
        </div>
        <div class="col-md">
          <div class="form-group">
            <label class="fw-bold " for="">Provincia</label>
            <div class="form-group">
              <p-dropdown (onChange)="onChangeDignidad()" [options]="provincias" [(ngModel)]="provincia" optionValue="codigo" (onChange)="getCantones()"
                placeholder="Selecciona la provincia" [filter]="true" filterBy="nombre" [style]="{'width':'100%'}"
                optionLabel="nombre" [showClear]="true">
              </p-dropdown>
            </div>
          </div>
        </div>
        <div class="col-md">
          <div class="form-group">
            <label class="fw-bold" for="">Cantón</label>
            <div class="form-group">
              <p-dropdown (onChange)="onChangeDignidad()" (onChange)="getParroquiaByCanton()" [options]="cantones" [(ngModel)]="canton"
                optionValue="codigo" placeholder="Selecciona el cantón" [filter]="true" filterBy="nombre"
                [style]="{'width':'100%'}" optionLabel="nombre" [showClear]="true">
              </p-dropdown>

            </div>
          </div>
        </div>
        <div class="col-md" >
          <div class="form-group">
            <label for="" class="fw-bold">Parroquia </label>
            <div class="form-group">
              <p-dropdown (onChange)="onChangeDignidad()" [options]="parroquias" [(ngModel)]="parroquia" optionValue="codigo" [filter]="true"
                filterBy="nombre" placeholder="Selecciona la parroquia" [style]="{'width':'100%'}" optionLabel="nombre"
                [showClear]="true">
              </p-dropdown>
            </div>

          </div>

        </div>
      </div>
      <br>
      <app-candidatos-por-dignidad></app-candidatos-por-dignidad>
      <app-porcentaje-escrutinio></app-porcentaje-escrutinio>

      <!-- </form> -->

    </mat-card-content>
  </mat-card>


  <!-- <app-sales></app-sales> -->


  <!-- <div>
    <div fxLayout="row wrap" fxLayoutGap="30px grid">
      <div fxFlex.md="33%" fxFlex.lg="33%" fxFlex.xl="33%" fxFlex.sm="100%">
        <app-activity></app-activity>
      </div>
      <div fxFlex.md="66%" class="overflow-x-hidden" fxFlex.lg="66%" fxFlex.xl="66%" fxFlex.sm="100%">
        <app-product></app-product>
      </div>
    </div>
  </div> -->


  <!-- <app-cards></app-cards> -->
</div>

<div class="card" *ngIf="!showDashboard">
  <div class="card-body">
    <div style="text-align: center">
      <p-divider align="center" type="dashed">
        <div class="inline-flex align-items-center">
          <b style="font-size: 20px;">Bienvenido</b>
          <i class="pi pi-user mr-2"></i>
        </div>
      </p-divider>
    </div>

    <section class="vh-100" style="background-color: #eee;">

            <div class="card" style="border-radius: 15px;">

                    class="rounded-circle img-fluid" style="width: 100px;" />
                </div>
                <h4 class="mb-2">{{ user.nombre }} {{ user.apellido}} </h4>
                <p class="text-muted mb-4">@Programmer <span class="mx-2">|</span> <a href="#!">mdbootstrap.com</a></p>
                <div class="mb-4 pb-2">
                  <button type="button" class="btn btn-outline-primary btn-floating">
                    <i class="fab fa-facebook-f fa-lg"></i>
                  </button>
                  <button type="button" class="btn btn-outline-primary btn-floating">
                    <i class="fab fa-twitter fa-lg"></i>
                  </button>
                  <button type="button" class="btn btn-outline-primary btn-floating">
                    <i class="fab fa-skype fa-lg"></i>
                  </button>
                </div>
                <!-- <button type="button" class="btn btn-primary btn-rounded btn-lg">
                  Message now
                </button> -->
                <div class="d-flex justify-content-between text-center mt-5 mb-2">
                  <div>
                    <p class="mb-2 h5">8471</p>
                    <p class="text-muted mb-0">Wallets Balance</p>
                  </div>
                  <div class="px-3">
                    <p class="mb-2 h5">8512</p>
                    <p class="text-muted mb-0">Income amounts</p>
                  </div>
                  <div>
                    <p class="mb-2 h5">4751</p>
                    <p class="text-muted mb-0">Total Transactions</p>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </div>
</div>
