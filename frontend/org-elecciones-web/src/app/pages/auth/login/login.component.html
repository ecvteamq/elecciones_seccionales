<div class="d-lg-flex half">
  <div
    class="bg order-1 order-md-2"
    style="
      background-image: url(&quot;assets/images/voting_blue.svg&quot;);
    "></div>
  <div class="contents order-2 order-md-1">
    <div class="container">
      <div class="row align-items-center justify-content-center">
        <!-- <div class="col-md-4">

                </div> -->
        <div class="col-md-7">
          <img
            src="assets/images/cne.png"
            style="width: 32%; margin: 0"
            alt="" />
          <h3><strong>Elecciones Seccionales y CPCCS 2027</strong></h3>
          <p class="mb-4">Ecuador unido en democracia 🇪🇨</p>
          <form [formGroup]="myForm" (ngSubmit)="login($event)">
            <div class="form-group first">
              <label for="username">Usuario</label>
              <input
                formControlName="identificacion"
                type="text"
                class="form-control"
                placeholder="C.I"
                id="username" />
              <div *ngIf="validErrorForm('identificacion')">
                <p class="text-danger">
                  {{ validTypeMsgForm("Identificación", "identificacion") }}
                </p>
              </div>
            </div>
            <div class="form-group last mb-3">
              <label for="password">Contraseña</label>
              <input
                formControlName="contrasenia"
                type="password"
                class="form-control"
                placeholder="Tu contraseña"
                id="password" />
              <div *ngIf="validErrorForm('contrasenia')">
                <p class="text-danger">
                  {{ validTypeMsgForm("Contraseña", "contrasenia") }}
                </p>
              </div>
            </div>

            <div class="d-flex" style="float: right">
              <label class="control control--checkbox mb-0"
                ><span class="caption">No tienes cuenta?</span>
              </label>
              <span class="ml-auto"
                ><a
                  routerLink="/auth/register"
                  style="
                    text-decoration: none;
                    color: black;
                    font-weight: bold;
                    margin-left: 2px;
                  "
                  class="forgot-pass"
                  >Registrate</a
                ></span
              >
            </div>

            <input
              type="submit"
              value="Iniciar Sesión"
              style="background-color: #226089"
              class="btn rounded-pill text-white mt-5" />
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
