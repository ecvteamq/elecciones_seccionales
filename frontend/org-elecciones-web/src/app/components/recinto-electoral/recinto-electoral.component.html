<div class="card">
    <div class="card-body">
        <div style="text-align: center">
            <h3>
                Recintos electorales
            </h3>
        </div>

        <p-tabView>
            <p-tabPanel header="Recintos activos">
                <p-table #dt [value]="recintos" [totalRecords]="recintos && recintos.length? recintos.length: 0"
                    styleClass="p-datatable-gridlines" [rows]="10" [paginator]="true"
                    [globalFilterFields]="['id', 'nombre','estado']" dataKey="id" [loading]="loadingTable"
                    [rowHover]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} items"
                    [showCurrentPageReport]="true">
                    <ng-template pTemplate="header">
                        <tr>
                            <th style="width: 4rem; text-align: center">#</th>
                            <th style="width: 10rem; text-align: center">
                                Nombre
                                <p-columnFilter [matchMode]="'contains'" [matchModeOptions]="matchModeOptions"
                                    type="text" field="nombre_recinto" display="menu"></p-columnFilter>
                            </th>
                            <th style="width: 10rem; text-align: center">
                                Direccion
                                <p-columnFilter [matchMode]="'contains'" [matchModeOptions]="matchModeOptions"
                                    type="text" field="direccion_recinto" display="menu"></p-columnFilter>
                            </th>
                            <th style="width: 8rem; text-align: center">
                                Provincia
                                <p-columnFilter field="nombre_provincia" matchMode="equals" display="menu"
                                    [showMatchModes]="false" [showOperator]="false" [showAddButton]="false"
                                    [showApplyButton]="false" [showClearButton]="false">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <p-dropdown [ngModel]="value" [options]="opcionesFiltro.provincia"
                                            placeholder="Todas las provincias" [showClear]="true" [filter]="true"
                                            [style]="{'min-width':'14rem'}" (onChange)="filter($event.value)">
                                        </p-dropdown>
                                    </ng-template>
                                </p-columnFilter>
                            </th>
                            <th style="width: 8rem; text-align: center">
                                Cantón
                                <p-columnFilter field="nombre_canton" matchMode="equals" display="menu"
                                    [showMatchModes]="false" [showOperator]="false" [showAddButton]="false"
                                    [showApplyButton]="false" [showClearButton]="false">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <p-dropdown [ngModel]="value" [options]="opcionesFiltro.canton"
                                            placeholder="Todos los cantones" [showClear]="true" [filter]="true"
                                            [style]="{'min-width':'14rem'}" (onChange)="filter($event.value)">
                                        </p-dropdown>
                                    </ng-template>
                                </p-columnFilter>
                            </th>
                            <th style="width: 8rem; text-align: center">
                                Parroquia
                                <p-columnFilter field="nombre_parroquia" matchMode="equals" display="menu"
                                    [showMatchModes]="false" [showOperator]="false" [showAddButton]="false"
                                    [showApplyButton]="false" [showClearButton]="false">
                                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                        <p-dropdown [ngModel]="value" [options]="opcionesFiltro.parroquia"
                                            placeholder="Todas las parroquias" [showClear]="true" [filter]="true"
                                            [style]="{'min-width':'14rem'}" (onChange)="filter($event.value)">
                                        </p-dropdown>
                                    </ng-template>
                                </p-columnFilter>
                            </th>
                            <th style="width: 4rem; text-align: center">Estado</th>
                            <th style="width: 4rem; text-align: center">Acciones</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-usuario let-i="rowIndex">
                        <tr>
                            <td style="text-align: center">{{i+1}}</td>
                            <td>{{usuario.nombre_recinto}}</td>
                            <td>{{usuario.direccion_recinto}}</td>
                            <td>{{usuario.nombre_provincia}}</td>
                            <td>{{usuario.nombre_canton}}</td>
                            <td>{{usuario.nombre_parroquia}}</td>
                            <td>{{usuario.estado}}</td>
                            <td class="x-caption">
                                <div class="row">
                                    <button title="Editar" icon="pi pi-pencil" pButton type="button" label=""
                                        (click)="edit(usuario)"
                                        class="p-button-raised p-button-rounded p-button-success p-button-sm"></button>
                                    <button title="eliminar" icon="pi pi-trash" pButton type="button" label=""
                                        (click)="delete(usuario)"
                                        class="p-button-raised p-button-rounded p-button-danger p-button-sm"></button>
                                </div>

                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td colspan="5" style="text-align: center">No hay usuarios activos.</td>
                        </tr>
                    </ng-template>
                </p-table>
            </p-tabPanel>
            
        </p-tabView>

        <p-dialog header="RecintoElectoral" [(visible)]="displayModal"
            [style]="{'width':'55vw', 'background-color':'purple'}" styleClass="modalStyle" [draggable]="true"
            [resizable]="false" (onHide)="onHide()">

            <div class="card-content">
                <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
                    

                    <div class="form-group mt-4" style="text-align: end;">

                        <button title="cancelar" icon="pi pi-close" pButton type="button" label="Cancelar"
                            (click)="limpiarForm()"
                            class="p-button-raised p-button-rounded p-button-danger p-button-sm"></button>

                        <button pButton type="button" [disabled]="myForm.invalid"
                            class="p-button-raised p-button-rounded p-button-success p-button-sm">
                            {{editMod == true? 'Actualizar':'Crear'}}
                        </button>
                    </div>
                </form>
            </div>

        </p-dialog>




    </div>
</div>
