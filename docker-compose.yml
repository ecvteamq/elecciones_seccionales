# Producción: frontend (nginx) + backend (Express) [+ PostgreSQL opcional]
#   docker compose up -d --build
#   docker compose --profile db up -d --build   # incluye PostgreSQL en contenedor
name: elecciones

services:
  backend:
    build:
      context: ./backend/org-elecciones-ws
      dockerfile: Dockerfile
    image: elecciones-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
    extra_hosts:
      # Permite usar DB_HOST=host.docker.internal si Postgres está instalado en el propio servidor
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    networks: [app]

  frontend:
    build:
      context: ./frontend/org-elecciones-web
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-}
    image: elecciones-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-80}:80"
    networks: [app]

  postgres:
    profiles: [db]
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app]

networks:
  app:

volumes:
  pgdata:
